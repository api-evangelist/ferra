name: Ferra
description: 'Ferra is a smart home strength-training system for adults aged 50 and over,
  built by Aroleap Fitness Private Limited in Bengaluru, India. It pairs a compact wall-mounted
  adaptive-resistance machine with a mobile app that queues a short guided daily workout of
  seven functional movements, adapts the weight in real time, tracks progress, and lets users
  share achievements with family. The service is sold as a no-lock-in monthly subscription
  (Individual, Duo, and Family tiers) billed through UPI auto-debit. Ferra is a consumer
  product with no public developer platform or API; this profile captures its identity and
  public web properties for the API Evangelist network. Backed by Prosus Ventures.'
